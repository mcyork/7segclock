; 7segclock — NTP clock on an ESP32-C3 Super Mini driving WS2812 seven-segment digits.
;
;   pio run                                        # build
;   pio run -t upload                              # flash over USB
;   pio run -t upload --upload-port mini7seg.local # OTA (ArduinoOTA)
;   bun Release.ts --check | --build | --publish   # the release chain; read its header
;
; PlatformIO rather than arduino-cli: arduino-cli bundles an x86-only ctags, so
; its build dies in the preprocessor on an Apple Silicon Mac without Rosetta.
;
; PINNED, deliberately. An unpinned `platform = espressif32` resolves to whatever
; is installed — on the dev machine it silently picked a locally installed
; pioarduino fork, while a clean checkout would pick the official platform with a
; different Arduino core. A release must be rebuildable from its tag, so every
; dependency names an exact version. Bump them on purpose, in their own commit.
;
; Two environments, one source. `c3supermini` is the release build: the library
; comes from git at a pinned commit, and Release.ts only ever builds this one.
; `dev` is for working on the library and the firmware together: it takes the
; library from a sibling checkout (../mini7seg) through a symlink, so a change
; there is picked up on the next build without a push. Same platform, same
; flags, same partitions — only the library source differs.
;
;   pio run                 # release env
;   pio run -e dev          # against ../mini7seg
;   pio run -e dev -t upload

[env:c3supermini]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board     = esp32-c3-devkitm-1   ; same silicon + 4 MB flash as the Super Mini
framework = arduino

; min_spiffs: two 1.92 MB app slots so OTA has somewhere to write the new image
; while the old one runs. The app is ~1.39 MB, so ~530 KB of headroom. nvs sits at
; the same offset as in the default table, so changing schemes did not lose saved
; wifi credentials or settings.
; ⚠ The partition table is part of the frozen release contract: OTA cannot change
; it, so every future build must keep min_spiffs.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed  = 921600

; The Super Mini has no USB-UART bridge — the C3's own USB-Serial-JTAG is the
; only port, so without CDC-on-boot there is no Serial at all.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  fastled/FastLED@3.10.5
  https://github.com/mcyork/mini7seg.git#f556e4e35f7221de19dda51282804d9895a772e0

; Development against a local library checkout. Never the source of a release.
[env:dev]
extends = env:c3supermini
lib_deps =
  fastled/FastLED@3.10.5
  symlink://../mini7seg
