; 7segclock — NTP clock on an ESP32-C3 Super Mini driving four WS2812 digits.
;
;   ~/.platformio/penv/bin/pio run                              # build
;   ~/.platformio/penv/bin/pio run -t upload                    # flash over USB
;   ~/.platformio/penv/bin/pio run -t upload --upload-port mini7seg.local   # OTA
;
; PlatformIO rather than arduino-cli: arduino-cli bundles an x86-only ctags, so
; its build dies in the preprocessor on an Apple Silicon Mac without Rosetta.

[env:c3supermini]
platform  = espressif32
board     = esp32-c3-devkitm-1   ; same silicon + 4 MB flash as the Super Mini
framework = arduino

; Two 1.92 MB app slots so OTA has somewhere to write the new image while the
; old one runs. nvs sits at the same offset as in the default table, so changing
; schemes does not lose saved wifi credentials or settings.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed  = 921600

; The Super Mini has no USB-UART bridge — the C3's own USB-Serial-JTAG is the
; only port, so without CDC-on-boot there is no Serial at all.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  fastled/FastLED@^3.10.0
  https://github.com/mcyork/mini7seg.git
